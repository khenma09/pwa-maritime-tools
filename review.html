<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta http-equiv="X-UA-Compatible" content="IE=edge" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes"
		/>
		<link rel="stylesheet" href="css/design-tokens.css" />
		<link rel="stylesheet" href="css/enhanced-components.css" />
		<link rel="stylesheet" href="css/style.css" />
		<link rel="stylesheet" href="styles.css" />
		<link
			rel="stylesheet"
			href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css"
		/>
		<title>Review Results</title>
		<link rel="stylesheet" href="css/review.css" />
	</head>
	<body>
		<div class="review-container">
			<div class="centered-intro">
				<h1>📊 Review Results</h1>
				<p class="intro-subtitle">
					Review your answers and see where you can improve
				</p>
			</div>
			<div class="summary" id="summary"></div>

			<!-- Filter Options -->
			<div class="text-center mb-30">
				<div class="filter-group">
					<button id="filter-correct" class="filter-btn">✓ Correct Only</button>
					<button id="filter-incorrect" class="filter-btn">
						✗ Incorrect Only
					</button>
				</div>
			</div>

			<div id="incorrect-questions"></div>
			<div class="text-center mt-30">
				<button id="back-btn" class="back-button">🏠 Back to Quiz</button>
			</div>

			<!-- Footer -->
			<div class="footer" style="margin-top: 40px;">
				<div class="footer-content">
					<p class="footer-text">
						Copyright &copy;
						<script>
							const startYear = 2022;
							const currentYear = new Date().getFullYear();
							document.write(
								startYear + (startYear < currentYear ? "-" + currentYear : "")
							);
						</script>
						2/OFF John Paulo C. Magpantay
					</p>
					<p class="footer-subtitle">
						All Rights Reserved | Maritime Professional Tools
					</p>
				</div>
			</div>
		</div>

		<script src="js/review.js"></script>
	</body>
</html>
