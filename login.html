<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes"
		/>
		<meta name="theme-color" content="#0a0a0f" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta
			name="apple-mobile-web-app-status-bar-style"
			content="black-translucent"
		/>
		<title>Login - Quiz Application</title>
		<link
			rel="stylesheet"
			href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap"
		/>
		<link rel="stylesheet" href="css/dark-purple-tokens.css" />
		<link rel="stylesheet" href="css/mobile-components.css" />
		<link rel="stylesheet" href="css/design-tokens.css" />
		<link rel="stylesheet" href="css/enhanced-components.css" />
		<link rel="stylesheet" href="css/login.css" />
		<link rel="stylesheet" href="css/custom-modal.css" />
		<script src="script.js"></script>
		<script src="js/custom-modal.js"></script>
		<script src="js/username-validation.js"></script>
		<script src="js/password-validation.js"></script>
	</head>
	<body class="pb-nav">
		<!-- Page Header -->
		<div class="page-header">
			<h1>🔐 Login</h1>
			<a href="index.html" class="btn-home">🏠 Back to Dashboard</a>
		</div>

		<div class="container">
			<div class="center-container">
				<form id="loginForm" action="quiz.html" method="GET">
					<h1>Login</h1>
					<label for="username">Username:</label>
					<input
						type="text"
						id="username"
						name="username"
						placeholder="8-12 chars, no spaces"
						minlength="8"
						maxlength="12"
						pattern="^\S{8,12}$"
						title="Username must be 8-12 characters with no spaces"
						required
					/>
					<label for="password">Password:</label>
					<input
						type="password"
						id="password"
						name="password"
						placeholder="8-22 chars, no spaces"
						minlength="8"
						maxlength="22"
						pattern="^\S{8,22}$"
						title="Password must be 8-22 characters with no spaces"
						required
					/>
					<input type="submit" value="Login" />
					<div class="create-account-container">
						<a href="createAccount.html">Create an Account</a>
						<a href="forgotPassword.html">Forgot Password</a>
					</div>
				</form>
			</div>
		</div>

		<!-- Mobile Bottom Navigation -->
		<nav class="mobile-nav">
			<a href="index.html">
				<span class="mobile-nav-icon">🏠</span>
				<span>Home</span>
			</a>
			<a href="start.html">
				<span class="mobile-nav-icon">📚</span>
				<span>Quiz</span>
			</a>
			<a href="eta.html">
				<span class="mobile-nav-icon">⏱️</span>
				<span>ETA</span>
			</a>
			<a href="leaderboard.html">
				<span class="mobile-nav-icon">🏆</span>
				<span>Ranks</span>
			</a>
		</nav>
	</body>
</html>
