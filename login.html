<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes" />
		<title>Login - Quiz Application</title>
		<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap">
		<link rel="stylesheet" href="css/design-tokens.css">
		<link rel="stylesheet" href="css/enhanced-components.css">
		<link rel="stylesheet" href="css/login.css">
		<script src="script.js"></script>
	</head>
	<body>
		<div class="container">
			<div class="center-container">
				<form id="loginForm" action="quiz.html" method="GET">
					<h1>Login</h1>
					<label for="username">Username:</label>
					<input type="text" id="username" name="username" required />
					<label for="password">Password:</label>
					<input type="password" id="password" name="password" required />
					<input type="submit" value="Login" />
					<div class="create-account-container">
						<a href="createAccount.html">Create an Account</a>
						<a href="forgotPassword.html">Forgot Password</a>
					</div>
				</form>
				<div class="copyright">
					Copyright &copy;

						const currentYear = new Date().getFullYear();
						document.write(startYear + (startYear < currentYear ? '-' + currentYear : ''));
					</script>
					<br />
					2/OFF John Paulo C. Magpantay<br />All Rights Reserved.
				</div>
			</div>
		</div>
	</body>
</html>
