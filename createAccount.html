<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
	<title>Create Account - Quiz Application</title>
	<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap">
	<style>
		* {
			box-sizing: border-box;
			margin: 0;
			padding: 0;
			outline: none;
			font-family: 'Montserrat', sans-serif;
		}

		body {
			margin: 0;
			font-size: 16px;
			background-color: #009688;
			font-family: 'Montserrat', sans-serif;
			font-weight: 400;
			min-height: 100vh;
			display: flex;
			align-items: center;
			justify-content: center;
			padding: 20px;
		}

		.container {
			max-width: 550px;
			width: 100%;
			background-color: #ffffff;
			margin: 40px auto;
			padding: 40px;
			border-radius: 10px;
			box-shadow: 0 8px 24px rgba(0, 0, 0, 0.15);
			animation: fadeInRight 0.8s ease;
		}

		@keyframes fadeInRight {
			0% {
				transform: translateX(40px);
				opacity: 0;
			}
			100% {
				transform: translateX(0px);
				opacity: 1;
			}
		}

		.center-container {
			display: flex;
			flex-direction: column;
			align-items: center;
			justify-content: center;
		}

		form {
			width: 100%;
		}

		h1 {
			font-size: 32px;
			color: #009688;
			font-weight: 700;
			margin-bottom: 30px;
			text-align: center;
			background: linear-gradient(135deg, #009688 0%, #00796b 100%);
			-webkit-background-clip: text;
			-webkit-text-fill-color: transparent;
			background-clip: text;
		}

		label {
			display: block;
			font-size: 15px;
			color: #333;
			font-weight: 500;
			margin-bottom: 8px;
			margin-top: 15px;
		}

		label:first-of-type {
			margin-top: 0;
		}

		input[type="text"],
		input[type="password"],
		input[type="email"],
		input[type="tel"],
		input[type="date"] {
			width: 100%;
			padding: 14px 18px;
			margin-bottom: 8px;
			box-sizing: border-box;
			border: 2px solid #e0e0e0;
			border-radius: 8px;
			font-size: 15px;
			color: #333;
			transition: all 0.3s ease;
			background-color: #f8f9fa;
		}

		input[type="text"]:focus,
		input[type="password"]:focus,
		input[type="email"]:focus,
		input[type="tel"]:focus,
		input[type="date"]:focus {
			border-color: #009688;
			background-color: #ffffff;
			box-shadow: 0 4px 8px rgba(0, 150, 136, 0.15);
		}

		input[type="submit"] {
			width: 100%;
			background: linear-gradient(135deg, #009688 0%, #00796b 100%);
			color: #ffffff;
			padding: 16px 20px;
			margin-top: 25px;
			border: none;
			border-radius: 8px;
			cursor: pointer;
			font-size: 16px;
			font-weight: 600;
			transition: all 0.3s ease;
			box-shadow: 0 4px 6px rgba(0, 150, 136, 0.3);
		}

		input[type="submit"]:hover {
			transform: translateY(-2px);
			box-shadow: 0 6px 12px rgba(0, 150, 136, 0.4);
		}

		.login-container {
			text-align: center;
			margin-top: 20px;
		}

		.login-container p {
			color: #666;
			font-size: 14px;
			margin-bottom: 8px;
		}

		a {
			color: #009688;
			text-decoration: none;
			font-size: 14px;
			font-weight: 500;
			transition: all 0.3s ease;
		}

		a:hover {
			color: #00796b;
			text-decoration: underline;
		}

		.copyright {
			text-align: center;
			font-size: 13px;
			color: #666;
			margin-top: 30px;
			padding-top: 20px;
			border-top: 1px solid #e0e0e0;
		}

		/* Form grid for larger screens */
		@media (min-width: 769px) {
			.form-row {
				display: grid;
				grid-template-columns: 1fr 1fr;
				gap: 15px;
			}

			.form-row .form-group {
				margin: 0;
			}

			.form-row .form-group label {
				margin-top: 0;
			}
		}

		.form-group {
			margin-bottom: 5px;
		}

		/* Responsive styles */
		@media (max-width: 768px) {
			.container {
				padding: 30px 25px;
				margin: 20px auto;
			}

			h1 {
				font-size: 28px;
			}

			input[type="text"],
			input[type="password"],
			input[type="email"],
			input[type="tel"],
			input[type="date"] {
				padding: 12px 16px;
				font-size: 14px;
			}

			input[type="submit"] {
				padding: 14px 18px;
				font-size: 15px;
			}
		}

		@media (max-width: 480px) {
			body {
				padding: 15px;
			}

			.container {
				padding: 25px 20px;
				margin: 15px auto;
			}

			h1 {
				font-size: 24px;
				margin-bottom: 25px;
			}

			input[type="text"],
			input[type="password"],
			input[type="email"],
			input[type="tel"],
			input[type="date"] {
				padding: 11px 14px;
				font-size: 13px;
			}

			input[type="submit"] {
				padding: 13px 16px;
				font-size: 14px;
			}

			a {
				font-size: 13px;
			}

			.login-container p {
				font-size: 13px;
			}
		}

		@media (max-width: 375px) {
			.container {
				padding: 20px 15px;
			}

			h1 {
				font-size: 22px;
			}
		}
	</style>
	<script src="script.js"></script>
</head>
<body>
	<div class="container">
		<div class="center-container">
			<form>
				<h1>Create an Account</h1>
				<div class="form-row">
					<div class="form-group">
						<label for="name">Name:</label>
						<input type="text" id="name" name="name" required>
					</div>
					<div class="form-group">
						<label for="username">Username:</label>
						<input type="text" id="username" name="username" required>
					</div>
				</div>
				<label for="password">Password:</label>
				<input type="password" id="password" name="password" required>
				<label for="email">Email:</label>
				<input type="email" id="email" name="email" required>
				<div class="form-row">
					<div class="form-group">
						<label for="contactNumber">Contact Number:</label>
						<input type="tel" id="contactNumber" name="contactNumber" required>
					</div>
					<div class="form-group">
						<label for="dob">Date of Birth:</label>
						<input type="date" id="dob" name="dob" required>
					</div>
				</div>
				<input type="submit" name="Submit" value="Create Account">
				<div class="login-container">
					<p>Already have an account?</p>
					<a href="login.html" id="loginLink">Login</a>
				</div>
			</form>
			<div class="copyright">
				Copyright &copy;
				<script>
					document.write(new Date().getFullYear());
				</script>
				<br />
				2/OFF John Paulo C. Magpantay<br />All Rights Reserved.
			</div>
		</div>
	</div>
</body>
</html>
