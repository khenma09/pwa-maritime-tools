<!DOCTYPE html>
<html lang="en">
	<head>
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self';">
		<meta charset="UTF-8" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes"
		/>
		<meta name="theme-color" content="#0a0a0f" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta
			name="apple-mobile-web-app-status-bar-style"
			content="black-translucent"
		/>
		<title>Create Account - Quiz Application</title>
		<link
			rel="stylesheet"
			href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap"
		/>
		<link rel="stylesheet" href="css/dark-purple-tokens.css" />
		<link rel="stylesheet" href="css/mobile-components.css" />
		<link rel="stylesheet" href="css/design-tokens.css" />
		<link rel="stylesheet" href="css/enhanced-components.css" />
		<link rel="stylesheet" href="css/custom-dropdown.css" />
		<link rel="stylesheet" href="css/createAccount.css" />
		<link rel="stylesheet" href="css/custom-modal.css" />
		<script src="script.js"></script>
		<script src="js/custom-modal.js"></script>
		<script src="js/custom-dropdown.js"></script>
		<script src="js/username-validation.js"></script>
		<script src="js/password-validation.js"></script>
	</head>
	<body class="pb-nav">
		<!-- Page Header -->
		<div class="page-header">
			<h1>� Create Account</h1>
			<a href="index.html" class="btn-home">🏠 Back to Dashboard</a>
		</div>

		<div class="container">
			<div class="center-container">
				<form>
					<h1>Create an Account</h1>
					<div class="form-row-title-name">
						<div class="form-group form-group-title">
							<label for="title">Title:</label>
							<div
								class="custom-dropdown"
								data-dropdown="title"
								data-placeholder="Select"
							>
								<button
									type="button"
									class="dropdown-trigger"
									aria-haspopup="listbox"
								>
									<span class="dropdown-value dropdown-placeholder"
										>Select</span
									>
									<span class="dropdown-arrow"></span>
								</button>
								<ul class="dropdown-menu" role="listbox">
									<li class="dropdown-option" data-value="Mr." role="option">
										Mr.
									</li>
									<li class="dropdown-option" data-value="Mrs." role="option">
										Mrs.
									</li>
									<li class="dropdown-option" data-value="Ms." role="option">
										Ms.
									</li>
									<li class="dropdown-option" data-value="Dr." role="option">
										Dr.
									</li>
									<li class="dropdown-option" data-value="Capt." role="option">
										Capt.
									</li>
									<li class="dropdown-option" data-value="Engr." role="option">
										ChEngr.
									</li>
								</ul>
							</div>
						</div>
						<div class="form-group form-group-name">
							<label for="name">Name:</label>
							<input
								type="text"
								id="name"
								name="name"
								placeholder="Enter your full name"
								required
							/>
						</div>
					</div>
					<label for="username">Username:</label>
					<input
						type="text"
						id="username"
						name="username"
						placeholder="8-12 characters, no spaces"
						minlength="8"
						maxlength="12"
						pattern="^\S{8,12}$"
						title="Username must be 8-12 characters with no spaces"
						required
					/>
					<label for="password">Password:</label>
					<input
						type="password"
						id="password"
						name="password"
						placeholder="8-22 characters, no spaces"
						minlength="8"
						maxlength="22"
						pattern="^\S{8,22}$"
						title="Password must be 8-22 characters with no spaces"
						required
					/>
					<label for="email">Email:</label>
					<input
						type="email"
						id="email"
						name="email"
						placeholder="Enter your email address"
						required
					/>
					<label for="instituteName">Institute Name:</label>
					<input
						type="text"
						id="instituteName"
						name="instituteName"
						placeholder="Enter your school or institution"
						required
					/>
					<div class="form-row">
						<div class="form-group">
							<label for="contactNumber">Contact Number:</label>
							<input
								type="tel"
								id="contactNumber"
								name="contactNumber"
								placeholder="+63 9XX XXX XXXX"
								required
							/>
						</div>
						<div class="form-group">
							<label for="dob">Date of Birth:</label>
							<input type="date" id="dob" name="dob" required />
						</div>
					</div>
					<input type="submit" name="Submit" value="Create Account" />
					<div class="login-container">
						<p>Already have an account?</p>
						<a href="login.html" id="loginLink">Login</a>
					</div>
				</form>
			</div>
		</div>

		<!-- Mobile Bottom Navigation -->
		<nav class="mobile-nav">
			<a href="index.html">
				<span class="mobile-nav-icon">🏠</span>
				<span>Home</span>
			</a>
			<a href="start.html">
				<span class="mobile-nav-icon">📚</span>
				<span>Quiz</span>
			</a>
			<a href="eta.html">
				<span class="mobile-nav-icon">⏱️</span>
				<span>ETA</span>
			</a>
			<a href="trueWind.html">
				<span class="mobile-nav-icon">💨</span>
				<span>Wind</span>
			</a>
		</nav>

		<script>
			// Handle form submission and redirect to login page
			document.querySelector('form').addEventListener('submit', function(e) {
				e.preventDefault();

				// Show success message
				showAlert(
					'Your account has been created. Redirecting to login page...',
					'Account Created Successfully!'
				);

				// Redirect to login page after 2 seconds
				setTimeout(function() {
					window.location.href = 'login.html';
				}, 2000);
			});
		</script>
	</body>
</html>
