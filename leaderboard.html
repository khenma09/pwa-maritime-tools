<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<title>Leaderboard - Quiz Application</title>
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes"
		/>
		<meta name="theme-color" content="#0a0a0f" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta
			name="apple-mobile-web-app-status-bar-style"
			content="black-translucent"
		/>
		<link rel="stylesheet" href="css/dark-purple-tokens.css" />
		<link rel="stylesheet" href="css/mobile-components.css" />
		<link rel="stylesheet" href="css/design-tokens.css" />
		<link rel="stylesheet" href="css/enhanced-components.css" />
		<link rel="stylesheet" href="css/style.css" />
		<link
			rel="stylesheet"
			href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css"
		/>
		<link
			rel="stylesheet"
			href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap"
		/>
		<link rel="stylesheet" href="css/quiz.css" />
		<link rel="stylesheet" href="css/leaderboard.css" />
	</head>
	<body class="page-bg-green pb-nav">
		<!-- Page Header -->
		<div class="page-header">
			<h1>🏆 Leaderboard</h1>
			<a href="index.html" class="btn-home">🏠 Back to Dashboard</a>
		</div>

		<div class="leaderboard-container custom-box">
			<!-- Header -->
			<div class="text-center mb-30">
				<p class="note-small">Top scores from all quiz participants</p>
			</div>

			<!-- Filter Section -->
			<div class="filter-section">
				<div class="filter-group">
					<label for="category-filter" class="filter-label"
						>Filter by Category:</label
					>
					<select id="category-filter" class="form-control custom-select">
						<option value="All Categories">All Categories</option>
						<option value="GMDSS">GMDSS & Communications</option>
						<option value="Navigation">Navigation</option>
						<option value="IMDG">IMDG Code</option>
						<option value="COLREG">COLREGS</option>
						<option value="Safety">Safety & Security</option>
						<option value="Signals">Signals & Flags</option>
					</select>
				</div>
				<div class="filter-group">
					<label for="sort-filter" class="filter-label">Sort by:</label>
					<select id="sort-filter" class="form-control custom-select">
						<option value="score">Highest Score</option>
						<option value="recent">Most Recent</option>
						<option value="questions">Most Questions</option>
					</select>
				</div>
			</div>

			<!-- Stats Summary -->
			<div class="stats-summary">
				<div class="stat-item">
					<div class="stat-label">Total Quizzes</div>
					<div class="stat-value" id="total-quizzes">0</div>
				</div>
				<div class="stat-item">
					<div class="stat-label">Top Score</div>
					<div class="stat-value" id="top-score">0%</div>
				</div>
			</div>

			<!-- Leaderboard Table -->
			<div class="leaderboard-table-container">
				<table class="leaderboard-table" id="leaderboard-table">
					<thead>
						<tr>
							<th>Rank</th>
							<th>Name</th>
							<th>Score</th>
							<th>Questions</th>
							<th>Category</th>
							<th>Date</th>
						</tr>
					</thead>
					<tbody id="leaderboard-body">
						<!-- Populated by JavaScript -->
					</tbody>
				</table>
				<div id="no-data-message" class="no-data-message hide">
					<p>📊 No quiz results yet. Be the first to take the quiz!</p>
				</div>
			</div>

			<!-- Action Buttons -->
			<div class="action-group">
				<button type="button" id="back-btn" class="btn start-cta action-btn">
					🏠 Back to Home
				</button>
				<button
					type="button"
					id="clear-leaderboard-btn"
					class="btn-neutral btn-home action-btn"
				>
					🗑️ Clear Leaderboard
				</button>
			</div>
		</div>

		<script src="js/leaderboard.js"></script>

		<!-- Mobile Bottom Navigation -->
		<nav class="mobile-nav">
			<a href="index.html">
				<span class="mobile-nav-icon">🏠</span>
				<span>Home</span>
			</a>
			<a href="start.html">
				<span class="mobile-nav-icon">📚</span>
				<span>Quiz</span>
			</a>
			<a href="eta.html">
				<span class="mobile-nav-icon">⏱️</span>
				<span>ETA</span>
			</a>
			<a href="leaderboard.html" class="active">
				<span class="mobile-nav-icon">🏆</span>
				<span>Ranks</span>
			</a>
		</nav>
	</body>
</html>
